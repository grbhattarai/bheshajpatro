<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BheshajPatro Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>Panchanga Settings</h1>

  <form method="post" action="/settings">
    <p>
      <label>Method</label><br>
      <select name="engine">
        <option value="drik" {% if engine == "drik" %}selected{% endif %}>Drik</option>
        <option value="ketaki" {% if engine == "ketaki" %}selected{% endif %}>Ketaki</option>
      </select>
    </p>

    <p>
      <label>Location key</label><br>
      <input type="text" name="key" value="{{ place.key or '' }}">
    </p>

    <p>
      <label>Location name</label><br>
      <input type="text" name="name" value="{{ place.name or '' }}" required>
    </p>

    <p>
      <label>Latitude</label><br>
      <input type="number" step="any" name="latitude" value="{{ place.latitude }}" required>
    </p>

    <p>
      <label>Longitude</label><br>
      <input type="number" step="any" name="longitude" value="{{ place.longitude }}" required>
    </p>

    <p>
      <label>Standard meridian</label><br>
      <input type="number" step="any" name="standard" value="{{ place.standard }}" required>
    </p>

    <p>
      <label>Timezone</label><br>
      <input type="text" name="tz" value="{{ place.tz }}" required>
    </p>

    <p>
      <label>Elevation (m)</label><br>
      <input type="number" step="any" name="elevation" value="{{ place.elevation or 0 }}">
    </p>

    <button type="submit">Save settings</button>
  </form>

  <form method="post" action="/settings/clear" style="margin-top: 1rem;">
    <button type="submit">Clear saved settings</button>
  </form>

  <p style="margin-top: 1rem;">
    <a href="/">Back to Panchanga</a>
  </p>
</body>
</html>
